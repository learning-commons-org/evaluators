name: 📐 Test Flesch-Kincaid

on:
  push:
    branches:
      - main
    paths:
      - 'packages/flesch-kincaid/**'
      # The parity corpus is built from every contract's fixtures, so a fixture text that
      # exercises a new tokenisation edge belongs in it.
      - 'evals/**'
      - '.github/workflows/test-flesch-kincaid.yml'
  pull_request:
    paths:
      - 'packages/flesch-kincaid/**'
      - 'evals/**'
      - '.github/workflows/test-flesch-kincaid.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 📐 Parity (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Unicode-aware sentence regex relies on lookbehind, so the floor matters.
        node: ['20.19.0', '22', '24']
    defaults:
      run:
        working-directory: packages/flesch-kincaid
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 😻 Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 📥 Install dependencies
        uses: bahmutov/npm-install@v1
        with:
          working-directory: packages/flesch-kincaid

      - name: 🔎 Type check
        run: npm run typecheck

      - name: 📐 Test
        run: npm test

      - name: 🏗️ Build
        run: npm run build
