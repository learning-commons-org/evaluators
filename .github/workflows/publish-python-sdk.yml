name: Publish Python SDK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # Both triggers run on the release tag: a release event sets github.ref to it, and a
    # manual run must select it under "Use workflow from".
    if: startsWith(github.ref, 'refs/tags/sdks-python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    concurrency:
      group: publish-python-sdk
      cancel-in-progress: false
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 📥 Install build tooling
        run: python -m pip install --upgrade build twine

      - name: 📦 Build sdist + wheel
        run: python -m build

      - name: 🧪 Validate distribution metadata
        run: python -m twine check dist/*

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          skip-existing: true
