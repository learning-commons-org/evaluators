# ─── TODOs / publish-pipeline hardening (tackle in a single follow-up PR) ────
#
# All deferred from the initial 0.1.0 publish PR. Address together once
# sdks-python-v0.1.0 has shipped to PyPI.
#
# 1. Remove `release-as: "0.1.0"` from release-please-config.json — sticky
#    setting that pins every future release-please PR to 0.1.0 until removed.
#    Required before any 0.1.1 / 0.2.0 can ship. Do this IMMEDIATELY after
#    0.1.0 lands on PyPI; otherwise subsequent releases silently no-op
#    (PyPI rejects duplicate version, `skip-existing: true` hides it).
#
# 2. Pin `workflow_dispatch` to a release tag. Today it checks out the
#    dispatch ref (typically main HEAD), not the released tag — so a manual
#    retry publishes whatever's currently on main, not the released version.
#    Add `inputs.ref` (required string) to the trigger and pass it to
#    actions/checkout. Or drop workflow_dispatch entirely and retry by
#    deleting + recreating the GitHub Release.
#
# 3. Assert `dist/` is non-empty before the publish step. `skip-existing: true`
#    masks broken builds — a `python -m build` that silently produces zero
#    artifacts will exit 0 at publish. Add a step that runs
#    `test -n "$(ls dist/*.whl 2>/dev/null)"` etc. before publish.
#
# 4. Harden `sdks/python/scripts/generate_settings.py --check` — exits 0 when
#    `sdks/settings/` is missing or empty. A future refactor that
#    renames/removes that directory would slip past CI. Add an explicit
#    "directory exists and has evaluators" assertion to the script.
#
# ─────────────────────────────────────────────────────────────────────────────

name: Publish Python SDK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'sdks-python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    concurrency:
      group: publish-python-sdk
      cancel-in-progress: false
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 📥 Install build tooling
        run: python -m pip install --upgrade build twine

      - name: 📦 Build sdist + wheel
        run: python -m build

      - name: 🧪 Validate distribution metadata
        run: python -m twine check dist/*

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          skip-existing: true
