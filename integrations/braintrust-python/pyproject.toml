[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-commons-braintrust-scorers"
version = "0.1.0"
description = "Braintrust adapter for Learning Commons evaluators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Learning Commons" }]
keywords = ["education", "evaluators", "braintrust", "evals", "scoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "learning-commons-evaluators>=0.2.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
braintrust = [
    "braintrust>=0.0.100",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/learning-commons-org/evaluators"
Repository = "https://github.com/learning-commons-org/evaluators/tree/main/integrations/braintrust-python"
Documentation = "https://docs.learningcommons.org/evaluators"
"Bug Tracker" = "https://github.com/learning-commons-org/evaluators/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
learning_commons_braintrust_scorers = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "tests"]
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true
